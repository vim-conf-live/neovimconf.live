# fly.toml app configuration file generated for neovimconfite on 2024-11-13T23:12:07Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nvc'
primary_region = 'ams'
kill_signal = 'SIGTERM'

[build]

[env]
  PHX_HOST = 'neovimconf.live'
  PORT = '8080'
  DATABASE_PATH = "/storage/db/nvc.db"

[http_service]
  internal_port = 8080
  force_https = true
  # auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = "sqlite"
  destination = "/storage/db"
